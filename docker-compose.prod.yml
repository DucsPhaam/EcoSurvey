version: '3.9'
name: ecosurvey-prod

services:
  # ── MySQL Database ──────────────────────────────────────────────
  db:
    image: poppy334/ecosurvey-db:latest
    container_name: ecosurvey-db-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-ecosurvey}
      MYSQL_USER: ${DB_USER:-ecosurvey}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ecosurveypass}
    ports:
      - "3307:3306"
    volumes:
      - db_data_prod:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD:-rootpassword}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ecosurvey-net-prod

  # ── Backend API ─────────────────────────────────────────────────
  backend:
    image: poppy334/ecosurvey-backend:latest
    container_name: ecosurvey-backend-prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ecosurvey}
      DB_USER: ${DB_USER:-ecosurvey}
      DB_PASSWORD: ${DB_PASSWORD:-ecosurveypass}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_very_long_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-another_refresh_secret_change_me}
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_DAYS: ${REFRESH_TOKEN_EXPIRES_DAYS:-30}  # used by cookie/DB logic
      CLIENT_URLS: ${CLIENT_URLS:-http://localhost}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-EcoSurvey <noreply@ecosurvey.edu>}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
    ports:
      - "5000:5000"
    networks:
      - ecosurvey-net-prod

  # ── Frontend ────────────────────────────────────────────────────
  frontend:
    image: poppy334/ecosurvey-frontend:latest
    container_name: ecosurvey-frontend-prod
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - ecosurvey-net-prod

volumes:
  db_data_prod:
    name: ecosurvey_prod_db_data

networks:
  ecosurvey-net-prod:
    driver: bridge
    name: ecosurvey-prod-network
